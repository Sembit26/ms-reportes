components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    RespuestaDisponibilidadBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/RespuestaDisponibilidadBody.json
          format: uri
          readOnly: true
          type: string
        base_datos:
          description: Estado de PostgreSQL.
          examples:
            - ok
          type: string
        estado:
          description: Disponibilidad del servicio.
          examples:
            - listo
          type: string
      required:
        - estado
        - base_datos
      type: object
    RespuestaSaludBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/RespuestaSaludBody.json
          format: uri
          readOnly: true
          type: string
        estado:
          description: Estado del proceso.
          examples:
            - ok
          type: string
        servicio:
          description: Nombre del microservicio.
          examples:
            - ms-reportes
          type: string
        version:
          description: Versión compilada del binario.
          examples:
            - dev
          type: string
      required:
        - estado
        - servicio
        - version
      type: object
info:
  description: API del microservicio MS Reportes (PINGESO Civil, Grupo 1).
  title: MS Reportes
  version: dev
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: obtener-salud-proceso
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaSaludBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Verifica si el proceso está vivo
      tags:
        - Salud
  /readyz:
    get:
      operationId: obtener-disponibilidad
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDisponibilidadBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Verifica si el servicio y PostgreSQL responden
      tags:
        - Salud
